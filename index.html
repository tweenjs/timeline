<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script>
			// The theme, before the first paint: the choice that was saved. Without one, CSS follows the system.
			try {
				var theme = localStorage.getItem('tweenjs-timeline-editor-theme')
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
			} catch (error) {}
		</script>
		<title>tween.js timeline editor</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
