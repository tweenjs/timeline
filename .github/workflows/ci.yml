name: CI

# Builds the editor and its docs, and publishes them to
# https://tweenjs.github.io/timeline/ from `main`.
#
# Only the default GITHUB_TOKEN is used (no personal access token). That token
# cannot switch GitHub Pages on, so once, in the repository:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format
        run: bun run lint
      - name: Types
        run: bun run typecheck
      - name: Model tests
        run: bun run test-model
      - name: Build
        run: bun run build
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test-e2e
      - name: Keep the report of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails early, with a message that says what to do, when Pages is off.
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
